<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Форма</title>
    <link rel="stylesheet" href="./css/normalize.css" />
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <form>
      <fieldset>
        <h2>Ваши личные данные</h2>
        <label for="Name">
          Ваше имя
          <input type="text" placeholder="Имя" name="name" required />
        </label>
        <label for="age">
          Ваш возраст
          <input type="number" placeholder="Возраст" name="age" required />
        </label>
        <label for="number">
          Ваш номер телефона
          <input
            type="tel"
            placeholder="Номер телефона"
            name="number"
            required
          />
        </label>
        <label for="email">
          Ваша почта
          <input type="email" placeholder="Почта" name="mail" required />
        </label>
        <label for="message">
          Ваше сообщение
          <textarea
            class="textarea"
            name="message"
            placeholder="Сообщение"
            required
          ></textarea>
        </label>
        <label for="checkbox">
          Я принимаю правила
          <input class="checkbox" type="checkbox" name="checkbox" required />
        </label>
        <button>Отправить</button>
      </fieldset>
    </form>
  </body>
</html>
